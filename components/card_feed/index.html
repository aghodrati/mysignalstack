<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #feed {
    /* max-height, not a fixed height -- with a fixed height the box always reserved 1400px even
       for 2 cards, which is exactly what read as "a separate boxed panel" rather than something
       that's part of the page. max-height + overflow-y:auto means the box shrinks to hug however
       tall the actually-rendered cards are, and only becomes a scroll area once real content
       exceeds the cap. Also not vh -- vh here would mean "% of the IFRAME's own viewport", which
       starts at a tiny default (a few px) before our first setFrameHeight() call ever runs, so vh
       would lock in a razor-thin frame forever (a bug hit earlier). */
    max-height: 1400px;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 2px 6px 2px 2px;
  }
  #count-line {
    font-size: 0.8rem;
    opacity: 0.65;
    padding: 0 0 0.5rem 2px;
    font-family: "Source Sans Pro", sans-serif;
  }
  #grid {
    display: grid;
    /* Default: responsive auto-fill. Overridden inline (gridEl.style.gridTemplateColumns) by
       applyDisplaySettings() below whenever Python passes an explicit column count -- see
       app.py's _render_card_display_settings/_render_keep_card_grid_iframe. */
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 0.9rem;
    align-items: start;
  }
  #sentinel { height: 1px; }
  #empty-msg { font-size: 0.85rem; opacity: 0.65; padding: 0.5rem 0; font-family: "Source Sans Pro", sans-serif; }

  .card-cell {
    position: relative;   /* containing block for .card-star's absolute positioning */
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
    transform: translateX(0);
    opacity: 1;
  }
  .card-cell.dragging { cursor: grabbing; }
  .card-star {
    position: absolute;
    top: 0.65rem;
    right: 0.75rem;
    font-size: 1.1rem;
    line-height: 1;
    color: rgba(150,150,150,0.55);   /* empty/outline state */
    cursor: pointer;
    z-index: 1;
  }
  .card-star.filled { color: #f5c518; }   /* favorited */
  .card-star.pin.filled { color: #4a9eff; }   /* pinned -- distinct from the gold favorite star */
  /* Ticker-logo <img> tags (front face only) are natively draggable by the browser by default --
     starting a swipe with the pointer over one could hijack the gesture into a native
     "drag this image" operation instead of delivering pointermove events to our own drag logic.
     pointer-events:none makes hit-testing skip the <img> entirely (the event lands on its parent
     div instead, then bubbles to the card wrapper exactly as if the image weren't there). */
  .card-cell img { pointer-events: none; -webkit-user-drag: none; user-drag: none; }

  body, .keep-card, .card-action-btn {
    font-family: -apple-system, BlinkMacSystemFont, "Source Sans Pro", sans-serif;
    color: inherit;
  }
  body { color: #e8e8e8; }
  @media (prefers-color-scheme: light) { body { color: #262730; } }

  .keep-card {
    border-radius: 0.6rem 0.6rem 0 0;
    padding: 0.9rem 1rem;
    background: rgba(151,166,195,0.08);
    border: 1px solid rgba(151,166,195,0.15);
    border-bottom: none;
  }

  .card-action-btn {
    display: block;
    width: 100%;
    box-sizing: border-box;
    border: none;
    font-size: calc(0.7rem * var(--card-font-scale, 1));
    padding: 0.3rem 0.4rem;
    background: #d3d3d3;
    color: #000000;
    border-radius: 0 0 0.6rem 0.6rem;
    cursor: pointer;
  }
  .card-action-btn:disabled { opacity: 0.6; cursor: default; }

  /* Every size below is base * var(--card-font-scale, 1), matching _inject_native_card_css's own
     scaling of the same classes in native mode -- see applyDisplaySettings() for where the variable
     itself gets set (from Python's font_scale prop, via _render_card_display_settings). */
  .keep-card-source {
    font-size: calc(0.75rem * var(--card-font-scale, 1)); color: #1baf7a; font-weight: 600;
    margin-bottom: 0.3rem;
  }
  .keep-card-claim {
    font-size: calc(0.92rem * var(--card-font-scale, 1)); font-weight: 600; line-height: 1.35;
    margin-bottom: 0.4rem;
  }
  .keep-card-context {
    font-size: calc(0.82rem * var(--card-font-scale, 1)); opacity: 0.85; line-height: 1.4;
    margin-bottom: 0.5rem;
  }
  .keep-card-meta { font-size: calc(0.72rem * var(--card-font-scale, 1)); opacity: 0.65; }

  details.keep-card-flip summary { list-style: none; cursor: pointer; display: block; }
  details.keep-card-flip summary::-webkit-details-marker { display: none; }
  details.keep-card-flip summary::marker { content: ""; }
  .keep-flip-summary { perspective: 1200px; }
  .keep-flip-inner {
    /* Both faces stacked in the same grid cell (grid-area: 1/1 below), not the more common
       position:absolute-for-the-back approach -- that sizes the card to the FRONT face only
       (back becomes an overlay matching that height, needing its own internal scrollbar whenever
       its content is taller). A shared grid cell still accounts for both children's intrinsic
       height when sizing the row, so the card is always exactly as tall as whichever face is
       taller, and neither face ever needs to scroll internally. */
    display: grid;
    width: 100%;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
  }
  details[open] .keep-flip-inner { transform: rotateY(180deg); }
  .keep-flip-front, .keep-flip-back {
    grid-area: 1 / 1;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .keep-flip-back {
    transform: rotateY(180deg);
  }
  .keep-card-summary-title {
    font-size: calc(0.75rem * var(--card-font-scale, 1)); color: #1baf7a; font-weight: 600;
    margin-bottom: 0.4rem;
  }
  .keep-card-summary { font-size: calc(0.8rem * var(--card-font-scale, 1)); opacity: 0.85; line-height: 1.4; }
  .keep-card-risk-item { margin-bottom: 0.6rem; }
  .keep-card-risk-item:last-child { margin-bottom: 0; }
</style>
</head>
<body>
<div id="feed"><div id="count-line"></div><div id="grid"></div><div id="sentinel"></div><div id="empty-msg" style="display:none;">No cards to show.</div></div>
<script>
/* Raw Streamlit bidirectional-component wire protocol (no build tooling / streamlit-component-lib
   needed -- this is just window.postMessage with the message shapes Streamlit's frontend expects:
   streamlit:componentReady on load, streamlit:render received per rerun, streamlit:setComponentValue
   / streamlit:setFrameHeight sent back). See finance/../MEMORY.md's pending-swipeable-card-component
   note for why this exists: a plain st.button forces a full-page rerun (and its scroll jump) just to
   hide one card. Here, hiding is 100% client-side (DOM removal, no rerun) -- the rerun this component
   does trigger (via setComponentValue, to persist the read-mark through finance.read_state) happens
   in the background and is invisible to the user because this component's own args barely change
   across it (see reconcile() below), so it doesn't touch cards this component already hid itself. */
function sendToStreamlit(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
function setFrameHeight() {
  sendToStreamlit("streamlit:setFrameHeight", { height: document.body.scrollHeight });
}
function reportAction(cardId, action) {
  sendToStreamlit("streamlit:setComponentValue", { value: { acted_id: cardId, action: action, ts: Date.now() } });
}

const PAGE_SIZE = 15;
const state = {
  order: [],              // card ids in current prop order
  dataById: new Map(),    // id -> {html, action}
  elements: new Map(),    // id -> wrapper element
  hiddenLocally: new Set(),// ids this component has already animated away (don't re-render even if
                           // a stale render event still lists them before Python catches up)
  revealed: 0,            // how many of `order` have been inserted into the DOM so far
  showCount: true,        // false for callers (e.g. the Read page) that already show their own count
};

const gridEl = document.getElementById("grid");
const sentinelEl = document.getElementById("sentinel");
const emptyMsgEl = document.getElementById("empty-msg");
const countLineEl = document.getElementById("count-line");

// Live "N card(s)" line -- updated the instant a card is dismissed (finalizeDismiss adds it to
// hiddenLocally right away, before the fade-out timer or the background Python round-trip even
// finish), not on the next Streamlit rerun. A plain st.caption computed in Python would only
// reflect this after a full rerun, which defeats the point of hiding cards without one.
function updateCountLine() {
  if (!state.showCount) {
    countLineEl.textContent = "";
    return;
  }
  const remaining = state.order.filter((id) => !state.hiddenLocally.has(id)).length;
  countLineEl.textContent = `${remaining} card${remaining === 1 ? "" : "s"}`;
}

function buildCell(card) {
  const wrapper = document.createElement("div");
  wrapper.className = "card-cell";
  wrapper.dataset.id = card.id;

  const body = document.createElement("div");
  body.innerHTML = card.html;
  wrapper.appendChild(body);

  // Always present (not just when already toggled on) -- an empty outline icon you can click to
  // toggle directly, as an alternative to swiping right (which only exists on some pages -- see
  // _render_keep_card_grid's swipe_right_action -- while this click toggle works everywhere,
  // including the Read/Favorites pages, independent of whichever swipe gestures a page offers).
  // Two independent flavors share this one control: "favorite" (every page except Discovery) and
  // "pin" (Discovery only -- see app.py's _render_discovery_page). They're deliberately separate
  // read_state kinds/Redis keys, not the same tag reused -- pinning a discovery candidate has
  // nothing to do with the Favorites page.
  const TOGGLE_KINDS = {
    favorite: { onIcon: "★", offIcon: "☆", onAction: "favorite", offAction: "unfavorite", cssClass: "" },
    pin: { onIcon: "📌", offIcon: "📌", onAction: "pin", offAction: "unpin", cssClass: "pin" },
  };
  const toggleKind = TOGGLE_KINDS[card.toggle_kind] || TOGGLE_KINDS.favorite;
  let toggled = !!card.toggled;
  // A toggled-on card (favorited, or pinned on Discovery) means "keep this" -- letting the discard
  // action still delete it out from under that would silently contradict the point of toggling it
  // on, so discard (button and left-swipe alike) is disabled for as long as a "discard"-action card
  // stays toggled on. Only discard is gated this way -- toggling never disables read/unread/
  // unfavorite elsewhere, since those aren't destructive.
  let discardDisabled = card.action === "discard" && toggled;
  const star = document.createElement("div");
  const toggleCssClass = toggleKind.cssClass ? " " + toggleKind.cssClass : "";
  star.className = "card-star" + toggleCssClass + (toggled ? " filled" : "");
  star.textContent = toggled ? toggleKind.onIcon : toggleKind.offIcon;
  star.addEventListener("click", (e) => {
    e.stopPropagation();
    toggled = !toggled;
    star.textContent = toggled ? toggleKind.onIcon : toggleKind.offIcon;
    star.classList.toggle("filled", toggled);
    if (card.action === "discard") {
      discardDisabled = toggled;
      btn.disabled = discardDisabled;
      btn.title = discardDisabled ? "Unpin first to discard" : "";
    }
    reportAction(card.id, toggled ? toggleKind.onAction : toggleKind.offAction);
  });
  wrapper.appendChild(star);

  const btnLabel = { unread: "Unread", unfavorite: "Unfavorite", discard: "Discard" }[card.action] || "Mark read";
  const btn = document.createElement("button");
  btn.className = "card-action-btn";
  btn.textContent = btnLabel;
  btn.disabled = discardDisabled;
  btn.title = discardDisabled ? "Unfavorite first to discard" : "";
  btn.addEventListener("click", () => dismiss(card.id, card.action));
  wrapper.appendChild(btn);

  attachSwipe(wrapper, card.id, card.action, card.swipe_right_action, () => discardDisabled);
  return wrapper;
}

function attachSwipe(wrapper, cardId, action, swipeRightAction, isDiscardDisabled) {
  const DRAG_THRESHOLD = 10;  // px of real horizontal movement before this becomes a drag, not a tap
  let pointerDown = false;
  let dragging = false;       // only true once movement has crossed DRAG_THRESHOLD, horizontally-dominant
  let pointerId = null;
  let startX = 0;
  let startY = 0;
  let dx = 0;

  // Swallows exactly the next click on this card -- used after a drag that crossed the threshold
  // but snapped back (didn't reach the dismiss distance), so the browser's own click-after-drag
  // doesn't also flip the card open/closed as an unwanted side effect. { once: true } removes it
  // as soon as that click arrives, but that click isn't guaranteed to fire at all after a captured
  // pointer sequence (browser-dependent) -- without the timeout fallback below, a click that never
  // arrives would leave this attached forever, silently eating some *later*, completely unrelated
  // tap on the same card. That intermittent "clicking stopped working" symptom was a real bug here.
  function swallowNextClick(e) {
    e.preventDefault();
    e.stopPropagation();
  }
  function armClickSwallow() {
    wrapper.addEventListener("click", swallowNextClick, { capture: true, once: true });
    window.setTimeout(() => wrapper.removeEventListener("click", swallowNextClick, true), 400);
  }

  wrapper.addEventListener("pointerdown", (e) => {
    if (e.target.tagName === "BUTTON" || e.target.classList.contains("card-star")) return;
    pointerDown = true;
    dragging = false;
    pointerId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    dx = 0;
    // Deliberately NOT calling setPointerCapture here -- capturing on every pointerdown (even a
    // plain tap) retargets the resulting click event to this wrapper instead of the actual
    // <summary> under the finger/cursor, which silently breaks the native flip-card toggle (see
    // _flip_card_html) for any tap that happens to land inside one. Capture is deferred to
    // pointermove, only once real drag movement is confirmed, so a plain tap is never touched and
    // reaches <summary> exactly as the browser would handle it natively.
  });
  wrapper.addEventListener("pointermove", (e) => {
    if (!pointerDown) return;
    dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!dragging) {
      // Require the movement to actually be a horizontal swipe, not just "moved at least 10px in
      // any direction" -- otherwise scrolling a flipped-open card's own scrollable back face
      // (.keep-flip-back, overflow-y:auto) or ordinary tap jitter can needlessly commit to drag
      // mode before the user meant to swipe at all.
      if (Math.abs(dx) < DRAG_THRESHOLD || Math.abs(dx) <= Math.abs(dy)) return;
      dragging = true;
      wrapper.classList.add("dragging");
      wrapper.setPointerCapture(pointerId);
    }
    wrapper.style.transform = `translateX(${dx}px)`;
    wrapper.style.opacity = Math.max(1 - Math.abs(dx) / 220, 0.15);
  });
  function endDrag() {
    pointerDown = false;
    if (!dragging) return;   // plain tap -- nothing to undo, let the native click go through
    dragging = false;
    wrapper.classList.remove("dragging");
    wrapper.style.transition = "transform 0.2s ease, opacity 0.2s ease";
    // A real drag happened -- the browser can still fire a click right after this pointerup
    // regardless of which branch below runs, which would otherwise flip the card open/closed (or
    // re-flip it right as it's flying off-screen) as an unintended side effect of the gesture.
    armClickSwallow();
    if (dx <= -90 && !(action === "discard" && isDiscardDisabled())) {
      finalizeDismiss(wrapper, cardId, action, -1);
    } else if (dx >= 90 && swipeRightAction) {
      finalizeDismiss(wrapper, cardId, swipeRightAction, 1);
    } else {
      wrapper.style.transform = "translateX(0)";
      wrapper.style.opacity = "1";
    }
    dx = 0;
  }
  wrapper.addEventListener("pointerup", endDrag);
  wrapper.addEventListener("pointercancel", endDrag);
}

function dismiss(cardId, action) {
  const wrapper = state.elements.get(cardId);
  if (!wrapper) return;
  wrapper.style.transition = "transform 0.2s ease, opacity 0.2s ease";
  finalizeDismiss(wrapper, cardId, action, -1);
}

function finalizeDismiss(wrapper, cardId, action, dir) {
  wrapper.style.transform = `translateX(${dir * 130}%)`;
  wrapper.style.opacity = "0";
  state.hiddenLocally.add(cardId);
  updateCountLine();
  window.setTimeout(() => {
    wrapper.remove();
    state.elements.delete(cardId);
    revealMore(1);   // pull in one more card from the queue to backfill the removed slot
    setFrameHeight();
  }, 200);
  reportAction(cardId, action);
}

function revealMore(count) {
  const limit = Math.min(count, PAGE_SIZE);
  count = 0;
  while (state.revealed < state.order.length && count < limit) {
    const id = state.order[state.revealed];
    state.revealed += 1;
    if (state.hiddenLocally.has(id)) continue;
    const card = state.dataById.get(id);
    if (!card) continue;
    const el = buildCell(card);
    state.elements.set(id, el);
    gridEl.appendChild(el);
    count += 1;
  }
  emptyMsgEl.style.display = gridEl.children.length === 0 ? "block" : "none";
  updateCountLine();
  setFrameHeight();
}

const observer = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    if (entry.isIntersecting && state.revealed < state.order.length) {
      revealMore(PAGE_SIZE);
    }
  }
}, { root: document.getElementById("feed"), rootMargin: "200px" });
observer.observe(sentinelEl);

function reconcile(cards) {
  const incomingIds = new Set(cards.map((c) => c.id));

  // Drop anything we're showing/queued that Python no longer sends (e.g. it got marked
  // read/unread from a different tab, or the underlying data changed) -- but never touch an id
  // we already animated away ourselves; that's just Python catching up to our own action.
  for (const id of Array.from(state.elements.keys())) {
    if (!incomingIds.has(id) && !state.hiddenLocally.has(id)) {
      const el = state.elements.get(id);
      el.remove();
      state.elements.delete(id);
    }
  }
  state.hiddenLocally.forEach((id) => {
    if (!incomingIds.has(id)) state.hiddenLocally.delete(id);
  });

  const previousOrder = state.order;
  const previouslyKnown = new Set(previousOrder);
  state.order = cards.map((c) => c.id);
  state.dataById = new Map(cards.map((c) => [c.id, c]));

  // Recompute how many are "revealed": every id already on-screen still counts as revealed, plus
  // keep revealing brand-new ids (appended cards from a fresh pipeline run) up to the same count
  // so newly-added cards don't jump straight to the bottom of an unrevealed queue.
  const stillOnScreen = state.order.filter((id) => state.elements.has(id)).length;
  const newIds = state.order.filter((id) => !previouslyKnown.has(id));
  state.revealed = Math.min(state.order.length, stillOnScreen + newIds.length);

  for (const id of newIds) {
    if (state.elements.has(id) || state.hiddenLocally.has(id)) continue;
    const card = state.dataById.get(id);
    const el = buildCell(card);
    state.elements.set(id, el);
    gridEl.appendChild(el);
  }

  if (gridEl.children.length === 0 && state.order.length > 0) {
    revealMore(PAGE_SIZE);
  }
  emptyMsgEl.style.display = gridEl.children.length === 0 ? "block" : "none";
  updateCountLine();
  setFrameHeight();
}

// `columns` is null/undefined for "Auto" (responsive auto-fill, the CSS default left in place) or
// an explicit int from the sidebar's Columns control; `font_scale` drives every calc(base *
// var(--card-font-scale, 1)) size in the stylesheet above. Both come from app.py's
// _render_card_display_settings by way of _render_keep_card_grid_iframe's component props -- see
// that function's own comment for why native mode's equivalent (_inject_native_card_css) is a
// separate implementation rather than shared code (this component's DOM has no access to it, being
// a different document inside the iframe).
function applyDisplaySettings(columns, fontScale) {
  document.documentElement.style.setProperty("--card-font-scale", fontScale || 1);
  gridEl.style.gridTemplateColumns = columns ? `repeat(${columns}, 1fr)` : "repeat(auto-fill, minmax(260px, 1fr))";
}

function onMessage(event) {
  const data = event.data;
  if (!data || data.type !== "streamlit:render") return;
  const args = data.args || {};
  applyDisplaySettings(args.columns, args.font_scale);
  state.showCount = args.show_count !== false;
  reconcile(args.cards || []);
}

window.addEventListener("message", onMessage);
sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
setFrameHeight();
</script>
</body>
</html>
